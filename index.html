<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملفي الشخصي | مطور مواقع ويب</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      max-width: 550px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 100px;
      height: 100px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: bold;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      color: #38bdf8;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .skills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .skill-tag {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-primary:hover {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-secondary {
      background: #334155;
      color: #ffffff;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">H</div>
    <div class="subtitle">مطور مواقع ويب طموح | Web Developer</div>
    <p>
      مرحبًا بكم في صفحتي التعريفية! أتعلم حاليًا أساسيات بناء وتصميم المواقع الإلكترونية الحديثة، وأشارك مشاريعي وتجاربي البرمجية عبر منصة GitHub.
    </p>

    <div class="skills">
      <span class="skill-tag">HTML5</span>
      <span class="skill-tag">CSS3</span>
      <span class="skill-tag">Git & GitHub</span>
      <span class="skill-tag">تصميم متجاوب</span>
    </div>

    <div class="buttons">
      <a href="https://github.com" target="_blank" class="btn btn-primary">حسابي على GitHub</a>
      <a href="mailto:your-email@example.com" class="btn btn-secondary">تواصل معي</a>
    </div>
  </div>

</body>
</html>
